name: iOS build
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Selecionar o Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Gerar o projeto
        working-directory: ios
        run: xcodegen generate
      - name: Compilar
        working-directory: ios
        run: |
          set +e
          xcodebuild -project LumiCatecismos.xcodeproj -scheme LumiCatecismos \
            -sdk iphonesimulator -configuration Debug -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build > ../build.log 2>&1
          status=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" ../build.log | sort -u | head -60
          exit $status
      - name: Simulador e capturas de tela
        run: bash ios/ci/shots.sh
      - name: Publicar capturas e log
        if: always()
        run: |
          mkdir -p /tmp/out /tmp/pub
          cp -r shots /tmp/out/ 2>/dev/null || true
          grep -E "error:|warning:|BUILD " build.log | sort -u | head -200 > /tmp/out/build-errors.txt || true
          cp -r /tmp/out/* /tmp/pub/
          cd /tmp/pub
          git init -q -b ci-shots
          git config user.name "lumi-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "CI: capturas e log [skip ci]"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-shots
