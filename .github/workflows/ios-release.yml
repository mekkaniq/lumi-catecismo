name: iOS release (TestFlight)
# Envia o app assinado ao TestFlight.
# Roda sozinho depois que o "iOS build" passa na branch main (só para o commit mais recente),
# ou na hora, em Actions > "iOS release (TestFlight)" > Run workflow.
on:
  workflow_run:
    workflows: ["iOS build"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Só o commit mais recente
        id: guard
        run: |
          git fetch -q --depth=100 origin main
          NEWER=$(git log --format=%h "$SHA..origin/main" -- ios .github/workflows/ios.yml 2>/dev/null | head -1)
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ -n "$NEWER" ]; then
            echo "Há um commit mais novo no app ($NEWER); este envio é dispensado."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Selecionar o Xcode 26
        if: steps.guard.outputs.skip != 'true'
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Conferir segredos
        if: steps.guard.outputs.skip != 'true'
        run: |
          for v in TEAM_ID KEY_ID ISSUER_ID; do
            if [ -z "${!v}" ]; then echo "Falta o segredo para $v"; exit 1; fi
          done
          if [ -z "${{ secrets.ASC_KEY_P8 }}" ]; then echo "Falta o segredo ASC_KEY_P8"; exit 1; fi
      - name: Instalar XcodeGen e gerar o projeto
        if: steps.guard.outputs.skip != 'true'
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Chave da API do App Store Connect
        if: steps.guard.outputs.skip != 'true'
        run: |
          echo "${{ secrets.ASC_KEY_P8 }}" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Arquivar (sem assinar; a assinatura de distribuição vem na exportação)
        if: steps.guard.outputs.skip != 'true'
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -project LumiCatecismos.xcodeproj -scheme LumiCatecismos \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Lumi.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tail -40
      - name: Exportar e enviar ao TestFlight
        if: steps.guard.outputs.skip != 'true'
        working-directory: ios
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Lumi.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            | tail -40
      - name: Registrar o resultado
        if: always()
        run: |
          mkdir -p /tmp/st && cd /tmp/st
          echo "sha=$SHA status=${{ job.status }} skipped=${{ steps.guard.outputs.skip }} run=${{ github.run_number }} time=$(date -u +%FT%TZ)" > release-status.txt
          git init -q -b ci-status
          git config user.name "lumi-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "release status [skip ci]"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-status
