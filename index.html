<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123d26">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Catecismos">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Breve Catecismo, Catecismo Maior e Confissão de Fé de Westminster em jogos: estudar, quiz, completar, montar e Modo Classe.">
<title>Lumi Catecismos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Belleza&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: coluna única de app (mobile-first), faixa verde no topo; Modo Classe ocupa a tela toda para projetar */
:root{
  --green:#215732;      /* verde IPB (Pantone 357 C) */
  --green-deep:#123d26;
  --primary:#215732;
  --green-soft:#e3ede6;
  --gold:#c6912c;       /* ouro (hot stamping da Bíblia) */
  --gray:#53565a;       /* Cool Gray 11 */
  --bg:#f5f6f2;
  --surface:#ffffff;
  --fg:#1d2420;
  --muted:#5f6862;
  --line:#d9ded8;
  --ok:#2f7d4a; --ok-bg:#e2f1e6;
  --bad:#b4472e; --bad-bg:#f8e6e0;
  --wool:#ffffff; --face:#2b2b2b;
  --band-fg:#f3f6f1;
  --bubble:#ffffff;
  --f-display:"Optima","Optima nova","Belleza","Candara","Segoe UI",sans-serif;
  --f-body:"Alegreya Sans","Optima","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --green:#6dbb89;--green-deep:#0c2418;--primary:#2c7a4b;--green-soft:#1c3226;--gold:#e0ad4a;--gray:#a3a8a4;
  --bg:#0f1712;--surface:#17221b;--fg:#e8eee9;--muted:#9aa79f;--line:#2a3a30;
  --ok:#6cc48a;--ok-bg:#1b3324;--bad:#ec8a72;--bad-bg:#3a201a;--wool:#eef0ec;--face:#1a1a1a;--band-fg:#eef3ee;--bubble:#22382b;color-scheme:dark}}
:root[data-theme="dark"]{
  --green:#6dbb89;--green-deep:#0c2418;--primary:#2c7a4b;--green-soft:#1c3226;--gold:#e0ad4a;--gray:#a3a8a4;
  --bg:#0f1712;--surface:#17221b;--fg:#e8eee9;--muted:#9aa79f;--line:#2a3a30;
  --ok:#6cc48a;--ok-bg:#1b3324;--bad:#ec8a72;--bad-bg:#3a201a;--wool:#eef0ec;--face:#1a1a1a;--band-fg:#eef3ee;--bubble:#22382b;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700;letter-spacing:.005em}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:500}

/* Faixa do topo */
.band{background:var(--green-deep);color:var(--band-fg)}
.band .wrap{padding-block:28px 26px;display:flex;gap:18px;align-items:center}
.band .eyebrow{color:color-mix(in srgb,var(--band-fg) 70%,transparent)}
.band h1{font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.1;margin:4px 0 6px}
.band p{margin:0;opacity:.85}
.bush{width:88px;flex:none}
.bush .f1{fill:#4c9a68}.bush .f2{fill:var(--gold)}.bush .bar{fill:var(--gold)}
.overall{margin-top:14px;height:6px;border-radius:3px;background:color-mix(in srgb,var(--band-fg) 18%,transparent);overflow:hidden}
.overall i{display:block;height:100%;background:var(--gold);border-radius:3px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--green-deep);color:var(--band-fg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--green-deep)}
.topbar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;min-height:52px}
.back{background:none;border:0;padding:6px 8px 6px 0;font-weight:500;color:inherit;display:flex;align-items:center;gap:4px}
.topbar .tt{font-family:var(--f-display);font-weight:700;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.topbar .count{font-variant-numeric:tabular-nums;opacity:.8;font-size:.9rem}

main{padding-block:22px 48px;display:flex;flex-direction:column;gap:26px}
section{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h h2{font-size:1.25rem}

/* Lista de lições */
.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.lesson{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px}
.lesson:hover .lt{color:var(--green)}
.num{font-family:var(--f-display);font-size:1.5rem;color:var(--green);font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.lt{font-weight:700;font-size:1.05rem;line-height:1.25;display:block}
.ls{font-size:.88rem;color:var(--muted)}
.mini{width:64px;height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.mini i{display:block;height:100%;background:var(--gold)}
.chev{color:var(--muted);font-size:1.3rem}

.continue{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;width:100%}
.continue .lumi{width:62px;flex:none}
.continue b{display:block;font-family:var(--f-display);font-size:1.1rem}

.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.tool b{font-family:var(--f-display);font-size:1.05rem}
.tool span{font-size:.88rem;color:var(--muted)}
.tool.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.tool.primary span{color:rgba(255,255,255,.82)}
.tool:hover{border-color:var(--green)}

/* Lista de perguntas da lição */
.qlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.qrow{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px}
.qrow .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.flames{display:inline-flex;gap:2px}
.flames svg{width:11px;height:14px}
.flames .on{fill:var(--gold)}.flames .off{fill:var(--line)}

/* Cartão de estudo */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.qnum{font-family:var(--f-display);color:var(--green);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.82rem}
.qtext{font-family:var(--f-display);font-size:clamp(1.35rem,5vw,1.65rem);line-height:1.25;font-weight:700}
.atext{font-size:1.12rem;line-height:1.6;max-width:62ch}
.atext.hidden{color:transparent;text-shadow:0 0 12px color-mix(in srgb,var(--fg) 55%,transparent);user-select:none}
.refs{font-size:.86rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px}
.refs b{color:var(--fg);font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.btn.solid{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1405}
.btn:disabled{opacity:.4;cursor:default}
.nav{display:flex;justify-content:space-between;gap:10px}

/* Jogo */
.dots{display:flex;gap:5px}
.dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.dots i.d{background:var(--gold)}.dots i.c{background:var(--green)}
.prompt-label{font-size:.85rem;color:var(--muted);margin:0}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;line-height:1.45;font-size:1rem}
.opt:hover:not(:disabled){border-color:var(--green)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.fill{font-size:1.12rem;line-height:2.1}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--muted);text-align:center;color:transparent;line-height:1.3}
.blank.cur{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent);border-radius:4px 4px 0 0}
.blank.ok{color:var(--green);font-weight:700;border-color:var(--green)}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:500;font-size:1rem}
.chip:hover:not(:disabled){border-color:var(--green)}
.chip.used{opacity:.25}
.chip.shake{animation:shake .35s;border-color:var(--bad);background:var(--bad-bg)}
.chip.long{text-align:left;line-height:1.35;font-weight:400}
.built{min-height:4em;background:var(--green-soft);border-radius:14px;padding:14px 16px;font-size:1.08rem;line-height:1.55}
.built:empty::before{content:"Toque nos trechos na ordem certa";color:var(--muted);font-style:italic}
.built span{animation:pop .25s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{from{opacity:0}to{opacity:1}}
.miss{font-size:.85rem;color:var(--bad)}

.feedback{position:sticky;bottom:0;background:var(--surface);border-top:3px solid var(--ok);padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));margin-top:auto}
.feedback.bad{border-top-color:var(--bad)}
.feedback .wrap{display:flex;gap:14px;align-items:flex-start}
.feedback .lumi{width:58px;flex:none}
.feedback .fb{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.feedback h3{font-size:1.2rem;color:var(--ok)}
.feedback.bad h3{color:var(--bad)}
.feedback.meh{border-top-color:var(--gold)}
.feedback.meh h3{color:color-mix(in srgb,var(--gold) 72%,var(--fg))}
.lumi.tilt{animation:tilt .6s ease-in-out}
@keyframes tilt{30%{transform:rotate(-6deg)}70%{transform:rotate(4deg)}}
.feedback p{margin:0;font-size:.98rem;max-height:30vh;overflow:auto}

.result{text-align:center;align-items:center}
.result .lumi{width:120px}
.big{font-family:var(--f-display);font-size:3rem;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums;line-height:1}

/* Modo Classe */
.class{min-height:calc(100vh - 52px);display:flex;flex-direction:column}
.class .stage{flex:1;max-width:1100px;margin:0 auto;width:100%;padding-block:4vh;display:flex;flex-direction:column;gap:3vh;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.class .qnum{font-size:clamp(.9rem,1.6vw,1.2rem)}
.class .qtext{font-size:clamp(1.7rem,4.4vw,3.4rem);line-height:1.18}
.class .atext{font-size:clamp(1.15rem,2.6vw,2rem);max-width:none;line-height:1.45}
.class .refs{font-size:clamp(.85rem,1.4vw,1.1rem)}
.class .controls{border-top:1px solid var(--line);background:var(--surface);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
.class .controls .wrap{max-width:1100px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 14px;max-width:100%}
.hint{font-size:.8rem;color:var(--muted);text-align:center}

.text-body{font-size:1.12rem;line-height:1.7;max-width:62ch}
.text-body ol{padding-left:1.4em;margin:0;display:flex;flex-direction:column;gap:10px}
.foot{font-size:.82rem;color:var(--muted);text-align:center;padding-bottom:12px}
/* Texto rolante */
.roll{display:flex;flex-wrap:wrap;column-gap:.28em;row-gap:0}
.rw{display:inline-flex;white-space:nowrap}
.rc{display:inline-block;overflow:hidden;height:1.15em;line-height:1.15;vertical-align:top}
.ri{display:flex;flex-direction:column;will-change:transform}
.ri>span{display:block;height:1.15em}
/* Capa */
.band .wrap.hero{display:flex;flex-direction:column;align-items:stretch;gap:16px;padding-block:26px 24px}
.hero-text h1{margin:4px 0 8px}
.lumi-row{display:flex;align-items:flex-end;gap:10px}
.bubble{position:relative;flex:1;min-width:0;background:var(--bubble);color:var(--fg);border-radius:18px 18px 4px 18px;padding:12px 15px;font-size:1rem;line-height:1.4;box-shadow:0 6px 20px rgba(0,0,0,.18);margin-bottom:34px;animation:pop .3s}
.bubble::after{content:"";position:absolute;right:-8px;bottom:0;width:16px;height:16px;background:var(--bubble);clip-path:polygon(0 0,0 100%,100% 100%)}
.bubble b{font-family:var(--f-display)}
.linkbtn{background:none;border:0;padding:6px 0 0;color:var(--green);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.lumi-stage{position:relative;width:132px;height:118px;flex:none;background:none;border:0;padding:0;border-radius:50%}
.lumi-stage::before{content:"";position:absolute;left:50%;bottom:-6px;width:150px;height:130px;transform:translateX(-50%);background:radial-gradient(closest-side,color-mix(in srgb,var(--gold) 38%,transparent),transparent);pointer-events:none}
.lumi-stage .bush{position:absolute;left:22px;bottom:4px;width:96px;opacity:.85}
.lumi-stage .lumi{position:absolute;left:0;bottom:2px;width:126px}
.hero-stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.88rem;opacity:.85}
.hero-stats b{font-family:var(--f-display);font-size:1.05rem;color:var(--gold)}
.band .overall{margin-top:0}
.week{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;gap:10px;border-top:4px solid var(--gold)}
.week-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.week-n{font-family:var(--f-display);font-weight:700;font-size:2rem;color:var(--green);line-height:1;font-variant-numeric:tabular-nums}
.week-q{font-family:var(--f-display);font-weight:700;font-size:1.25rem;line-height:1.3;margin:0;text-wrap:balance}
.cont-n{font-family:var(--f-display);font-weight:700;font-size:1.6rem;color:var(--green);width:44px;text-align:center;flex:none}
.continue .chev{margin-left:auto}
/* Lumi viva */
.lumi{overflow:visible}
.lumi .body{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.4s ease-in-out infinite}
.lumi .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.lumi .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.5s ease-in-out infinite}
.lumi .ear{transform-box:fill-box;transform-origin:100% 50%;animation:ear 5s ease-in-out infinite}
.lumi[data-mood=sad] .head{transform-box:view-box;transform-origin:62px 44px;transform:rotate(7deg)}
.lumi[data-mood=sad] .flame{opacity:.45;animation:none}
.lumi[data-mood=sleep] .body{animation-duration:5s}
.lumi[data-mood=sleep] .flame{opacity:.55}
.lumi .tear{animation:tear 1.6s ease-in infinite}
.lumi .dots circle{animation:dot 1.4s infinite}
.lumi .dots circle:nth-child(2){animation-delay:.2s}.lumi .dots circle:nth-child(3){animation-delay:.4s}
.lumi .zz text{animation:zz 2.4s ease-in-out infinite}.lumi .zz text:nth-child(2){animation-delay:.6s}
.lumi .spark path{transform-box:fill-box;transform-origin:center;animation:twinkle 1s ease-in-out infinite}
.lumi .spark path:nth-child(2){animation-delay:.3s}.lumi .spark path:nth-child(3){animation-delay:.6s}
.lumi.hop{animation:hop .55s ease-out}
.lumi.shake{animation:lshake .5s}
.lumi[data-mood=cheer]{animation:hop .6s ease-out 2}
@keyframes breathe{50%{transform:scale(1.025,.975)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes flick{50%{transform:scale(1.15,.9) rotate(5deg)}}
@keyframes ear{0%,88%,100%{transform:rotate(0)}93%{transform:rotate(-14deg)}}
@keyframes hop{30%{transform:translateY(-12px)}60%{transform:translateY(0)}78%{transform:translateY(-3px)}}
@keyframes lshake{20%{transform:translateX(-5px) rotate(-3deg)}40%{transform:translateX(5px) rotate(3deg)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes tear{0%{transform:translateY(0);opacity:1}100%{transform:translateY(9px);opacity:0}}
@keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes zz{0%{opacity:0;transform:translate(0,4px)}40%{opacity:1}100%{opacity:0;transform:translate(4px,-6px)}}
@keyframes twinkle{50%{transform:scale(.4);opacity:.5}}
.qhead{display:flex;gap:12px;align-items:flex-start}
.qhead>div:first-child{flex:1}
.lumi-live{width:74px;flex:none;margin-top:-4px}
.result-lumi{width:130px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-24px;width:14px;height:18px;animation:fall linear forwards}
.confetti svg{width:100%;height:100%}.confetti path{fill:var(--gold)}
.confetti i:nth-child(3n) path{fill:#4c9a68}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(var(--r))}}
/* Classe */
.class-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.class-lumi{width:clamp(64px,9vw,110px);flex:none}
.score{background:var(--green-soft);border-top:1px solid var(--line);padding-block:10px}
.score .wrap{max-width:1100px;display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:center;align-items:center}
.team{display:flex;align-items:center;gap:8px;font-weight:500}
.team b{font-family:var(--f-display);font-size:1.7rem;min-width:1.6em;text-align:center;font-variant-numeric:tabular-nums}
.btn.sm{padding:6px 12px}
/* Cores de cada livro: Breve = verde IPB, Maior = vinho, Confissão = azul-petróleo */
:root[data-book="maior"]{--green:#7b2d35;--green-deep:#3f161b;--primary:#7b2d35;--green-soft:#f4e7e8}
:root[data-book="conf"]{--green:#1f5068;--green-deep:#102c3a;--primary:#1f5068;--green-soft:#e3edf2}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"])[data-book="maior"]{--green:#e3949b;--green-deep:#2a0e12;--primary:#94404a;--green-soft:#33191c}
  :root:not([data-theme="light"])[data-book="conf"]{--green:#86c0da;--green-deep:#0a1d27;--primary:#2c6a88;--green-soft:#15303d}}
:root[data-theme="dark"][data-book="maior"]{--green:#e3949b;--green-deep:#2a0e12;--primary:#94404a;--green-soft:#33191c}
:root[data-theme="dark"][data-book="conf"]{--green:#86c0da;--green-deep:#0a1d27;--primary:#2c6a88;--green-soft:#15303d}
/* Recepção: a Lumi brincando com os livros */
.band.hub .wrap.hero{gap:10px}
.scene-wrap{display:flex;justify-content:center;margin:-4px 0 -6px}
.scene{width:min(100%,420px);height:auto;overflow:visible}
.scene .lumi{--ink:#1d2420}
.scene .bk{cursor:pointer;transition:filter .2s}
.scene .bk:hover,.scene .bk:focus-visible{filter:brightness(1.18);outline:none}
.scene .bk-breve{transform-box:fill-box;transform-origin:0% 100%;animation:lean 5s ease-in-out infinite}
.scene .bk-conf{transform-box:fill-box;transform-origin:50% 100%;animation:nudge 5s ease-in-out infinite}
.scene .lumi-on-books>.lumi{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
.scene .lumi-on-books>.lumi.hop{animation:hop .5s ease-out}
.scene .page{transform-box:fill-box;transform-origin:center;animation:flutter 3.2s ease-in-out infinite}
.scene .notes path{transform-box:fill-box;transform-origin:center;animation:twinkle 1.8s ease-in-out infinite}
.scene .notes path:nth-child(2){animation-delay:.9s}
@keyframes lean{0%,100%{transform:rotate(0)}45%{transform:rotate(0)}55%{transform:rotate(-7deg)}65%{transform:rotate(0)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(0)}58%{transform:translateX(4px)}66%{transform:translateX(0)}}
@keyframes sway{0%,40%,100%{transform:rotate(0) translateY(0)}48%{transform:rotate(-4deg) translateY(-6px)}56%{transform:rotate(3deg) translateY(0)}62%{transform:rotate(0)}}
@keyframes flutter{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-6deg)}}
.hub-bubble{margin-bottom:6px;border-radius:18px}
.hub-bubble::after{left:50%;right:auto;top:-8px;bottom:auto;transform:translateX(-50%) rotate(45deg);width:14px;height:14px;clip-path:none;border-radius:2px}

.shelf{display:flex;flex-direction:column;gap:12px}

.bookcard .spine::after{content:"";position:absolute;inset:14px 4px;border-top:2px solid #e0ad4a;border-bottom:2px solid #e0ad4a}

/* Barra de rolagem: a do navegador fica escondida; uma fina aparece só enquanto rola */
html{scrollbar-width:none}
html::-webkit-scrollbar{display:none}
.sb-thumb{position:fixed;right:max(3px,env(safe-area-inset-right,0px));top:0;width:6px;border-radius:6px;background:color-mix(in srgb,var(--fg) 38%,transparent);opacity:0;transition:opacity .35s,width .15s;z-index:60;touch-action:none;cursor:grab}
.sb-thumb.show,.sb-thumb.drag{opacity:1}
.sb-thumb:hover,.sb-thumb.drag{width:9px;opacity:1}
@media (hover:none){.sb-thumb{pointer-events:none}}
/* Barra de rolagem: some quando a página está parada e aparece fina ao rolar */
html{scrollbar-width:thin;scrollbar-color:transparent transparent;transition:scrollbar-color .3s}
html.scrolling{scrollbar-color:color-mix(in srgb,var(--muted) 70%,transparent) transparent}
@supports not (scrollbar-color:red blue){
  html::-webkit-scrollbar{width:8px;background:transparent}

/* ===== Profundidade, luz e leitura ===== */
:root{--sh-1:0 1px 2px rgba(16,32,24,.06),0 4px 14px -6px rgba(16,32,24,.12);--sh-2:0 2px 4px rgba(16,32,24,.06),0 18px 40px -16px rgba(16,32,24,.28);--hl:rgba(255,255,255,.7)}

main{gap:30px}
.sec-h h2{font-size:1.35rem;letter-spacing:-.005em}
/* cartões com relevo e luz que segue o dedo */
.tool,.week,.continue,.card,.bookcard{position:relative;overflow:hidden;box-shadow:var(--hl) 0 1px 0 inset,var(--sh-1);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .3s}

/* estante dos três livros */
.shelf{gap:16px}
.bookcard{grid-template-columns:18px 1fr auto;min-height:132px;border-color:color-mix(in srgb,var(--bc) 22%,var(--line));background:linear-gradient(120deg,color-mix(in srgb,var(--bc) 7%,var(--surface)),var(--surface) 55%)}

.bc-body b{font-size:1.45rem;letter-spacing:-.01em}

/* Text roll */
.tr-w{display:inline-block;white-space:nowrap}
.tr-c{position:relative;display:inline-block;overflow:hidden;vertical-align:top;line-height:1.18;height:1.18em}

.bookcard:hover .tr-c>span:first-child,.bookcard:focus-visible .tr-c>span:first-child,.bookcard.roll .tr-c>span:first-child{transform:translateY(-105%)}

:root[data-theme="dark"] .tr-c>span+span{color:color-mix(in srgb,var(--bc) 45%,#fff)}

canvas.fx{position:absolute;inset:0;width:100%;height:100%;z-index:-1;display:block}
