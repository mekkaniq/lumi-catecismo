name: LumiCatecismos
options:
  bundleIdPrefix: br.com.lumi
  developmentLanguage: pt-BR
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  LumiCatecismos:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../aula
        type: folder
        buildPhase: resources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Verso Vivo Catecismos
        UIAppFonts: [Cinzel-Bold.ttf]
        CFBundleDevelopmentRegion: pt-BR
        CFBundleLocalizations: [pt-BR]
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Aula do Verso Vivo
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [br.com.editoraversovivo.aula]
          - CFBundleTypeName: Apresentação ou PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.openxmlformats.presentationml.presentation, com.adobe.pdf]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: br.com.editoraversovivo.aula
            UTTypeDescription: Aula do Verso Vivo
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [vvaula]
              public.mime-type: [application/x-vvaula]
        UILaunchScreen:
          UIColorName: LaunchBG
          UIImageName: LaunchLumi
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.lumi.catecismos
        PRODUCT_NAME: LumiCatecismos
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
