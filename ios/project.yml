name: LumiCatecismos
options:
  bundleIdPrefix: br.com.lumi
  developmentLanguage: pt-BR
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  LumiCatecismos:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Lumi Catecismos
        CFBundleDevelopmentRegion: pt-BR
        CFBundleLocalizations: [pt-BR]
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBG
          UIImageName: LaunchLumi
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.lumi.catecismos
        PRODUCT_NAME: LumiCatecismos
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
